[package]
name = "nvis"
version = "0.4.0"
edition = "2021"

[features]
default = ["nsys", "ncu", "torch"]
nsys = []
ncu = []
torch = ["dep:serde_json"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
tui-input = "0.10"
csv = "1.3"
toml = "0.8"
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
rust-s3 = { version = "0.37", default-features = false, features = ["sync-native-tls"] }
aws-creds = { version = "0.39", default-features = false }
aws-region = { version = "0.28", default-features = false }
log = "0.4"
env_logger = "0.11"
whoami = "1"
base64 = "0.22"
sha2 = "0.10"
