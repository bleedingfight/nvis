[package]
name = "nvis"
version = "0.4.0"
edition = "2021"

[features]
default = ["nsys", "ncu", "torch"]
nsys = []
ncu = []
torch = ["serde", "serde_json"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
tui-input = "0.10"
csv = "1.3"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
